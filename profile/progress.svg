<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="Current missions progress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="560" rx="18" fill="url(#bg)"/>
  <circle cx="60" cy="40" r="90" fill="#22d3ee" opacity="0.07"/>
  <circle cx="720" cy="520" r="110" fill="#a78bfa" opacity="0.07"/>
  <text x="36" y="46" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="800" fill="url(#accent)" filter="url(#glow)">CURRENT MISSIONS</text>
  <line x1="36" y1="60" x2="724" y2="60" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1"/>
  
  <g transform="translate(0,84)">
    <text x="36" y="20" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3">VR Scene Building</text>
    <text x="36" y="40" font-family="'Inter',sans-serif" font-size="12" fill="#8b949e">Native VR scene editor with Unity &amp; OpenXR, two controllers.</text>
    <rect x="36" y="52" width="488" height="14" rx="7" fill="#1c2536"/>
    <rect x="36" y="52" width="317" height="14" rx="7" fill="#22d3ee">
      <animate attributeName="width" from="0" to="317" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="324" y="22" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#22d3ee">65%</text>
  </g>

  <g transform="translate(0,178)">
    <text x="36" y="20" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3">Live Avatars</text>
    <text x="36" y="40" font-family="'Inter',sans-serif" font-size="12" fill="#8b949e">Avatar rigs rendered client-side, driven via LiveKit.</text>
    <rect x="36" y="52" width="488" height="14" rx="7" fill="#1c2536"/>
    <rect x="36" y="52" width="220" height="14" rx="7" fill="#a78bfa">
      <animate attributeName="width" from="0" to="220" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="324" y="22" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#a78bfa">45%</text>
  </g>

  <g transform="translate(0,272)">
    <text x="36" y="20" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3">AI Agent Stack</text>
    <text x="36" y="40" font-family="'Inter',sans-serif" font-size="12" fill="#8b949e">Personal on-device answer memory and multi-agent app factory.</text>
    <rect x="36" y="52" width="488" height="14" rx="7" fill="#1c2536"/>
    <rect x="36" y="52" width="268" height="14" rx="7" fill="#34d399">
      <animate attributeName="width" from="0" to="268" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="324" y="22" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#34d399">55%</text>
  </g>

  <g transform="translate(0,366)">
    <text x="36" y="20" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3">Music Production</text>
    <text x="36" y="40" font-family="'Inter',sans-serif" font-size="12" fill="#8b949e">Lossless Suno catalogue workflows and festival gig acquisition tools.</text>
    <rect x="36" y="52" width="488" height="14" rx="7" fill="#1c2536"/>
    <rect x="36" y="52" width="171" height="14" rx="7" fill="#f472b6">
      <animate attributeName="width" from="0" to="171" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="324" y="22" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#f472b6">35%</text>
  </g>

  <g transform="translate(0,460)">
    <text x="36" y="20" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#e6edf3">Fiction Writing</text>
    <text x="36" y="40" font-family="'Inter',sans-serif" font-size="12" fill="#8b949e">Book of Tammuz — a dark mythic novel in progress.</text>
    <rect x="36" y="52" width="488" height="14" rx="7" fill="#1c2536"/>
    <rect x="36" y="52" width="122" height="14" rx="7" fill="#fbbf24">
      <animate attributeName="width" from="0" to="122" dur="0.9s" fill="freeze"/>
    </rect>
    <text x="324" y="22" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#fbbf24">25%</text>
  </g>
</svg>