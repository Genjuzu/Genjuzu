name: Update profile visuals
on:
  push:
    branches: [main]
    paths:
      - "profile/progress.json"
      - "profile/stack.json"
      - "scripts/render-progress.mjs"
      - "scripts/render-stack.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render progress card
        run: node scripts/render-progress.mjs
        env:
          # Default: counts issues labeled `mission:<id>` in this repo only.
          # To also count issues in private repos, add a fine-grained PAT with
          # Issues read access as a repo secret named GH_PAT. The resulting
          # percentages become public on the profile page.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Render stack card
        run: node scripts/render-stack.mjs
        env:
          # Without GH_PAT the stack card uses public repos only. Add a fine-
          # grained PAT with repo read access as GH_PAT to also include private
          # repos. Only aggregate data is shown, never repo names.
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit rendered visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/progress.svg profile/stack.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: render profile visuals"
            git push
          fi
